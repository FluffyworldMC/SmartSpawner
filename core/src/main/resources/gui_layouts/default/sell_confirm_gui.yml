# ──────────────────────────────────────────────────────────────
#  Sell Confirmation GUI – icons, text and actions
# ──────────────────────────────────────────────────────────────
# Slot numbers are 1-27 (3 rows).
#
# Placeholders: {entity}, {ᴇɴᴛɪᴛʏ}, {current_items}, {max_items},
# {current_exp}, {total_sell_price}, {percent_storage_decimal},
# {percent_storage_rounded}, {loot_items} and PlaceholderAPI %placeholders%.
#
# Extra keys:
#   name_with_exp / lore_with_exp   used on the confirm button when the
#                                   click also collects stored experience
#   loot_items / loot_items_empty  format for the {loot_items} lore line
#
# Actions: cancel, confirm, none.

title: "&#545454ᴄᴏɴꜰɪʀᴍ ꜱᴇʟʟ"

# Sell immediately without showing this screen.
skip_sell_confirmation: false


# ── Cancel ────────────────────────────────────────────────────
slot_11:
  material: RED_STAINED_GLASS_PANE
  name: "&#f50001ᴄᴀɴᴄᴇʟ"
  lore:
    - "&fClick to cancel"
  enabled: true
  click:
    action: "cancel"
    sound: ui.button.click


# ── Spawner / loot summary ────────────────────────────────────
slot_14:
  material: PLAYER_HEAD
  name: "&#02e57dʟᴏᴏᴛ"
  lore:
    - "{loot_items}"
  loot_items: "&#02e57d{amount} &f{item_name}"
  loot_items_empty: "&#02e57dNo items to sell"
  enabled: true
  info_button: true
  click:
    action: "none"


# ── Confirm ───────────────────────────────────────────────────
slot_17:
  material: LIME_STAINED_GLASS_PANE
  name: "&#01ff00ᴄᴏɴꜰɪʀᴍ"
  lore:
    - "&fClick to sell all items"
    - "&7(${total_sell_price})"
  name_with_exp: "&#01ff00ᴄᴏɴꜰɪʀᴍ"
  lore_with_exp:
    - "&fClick to sell all items and collect xp"
    - "&7(${total_sell_price} + {current_exp} xp)"
  enabled: true
  click:
    action: "confirm"
    sound_success: block.note_block.bell
    sound_fail: block.note_block.pling
