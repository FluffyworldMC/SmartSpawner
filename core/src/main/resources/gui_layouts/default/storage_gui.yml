# ──────────────────────────────────────────────────────────────
#  Storage GUI – every control button and its text
# ──────────────────────────────────────────────────────────────
# Slots 1-9 are the bottom control row (inventory slots 46-54).
# The top 45 slots are the generated item page and are not configured here.
#
# Same slot keys as main_gui.yml: material/item/custom_texture, name, lore,
# item_model, custom_model_data, amount, hide_tooltip, enabled, condition/if,
# click/left_click/right_click, cooldown.
#
# Extra keys used by storage buttons:
#   sort button  : sort_selected, sort_unselected, sort_empty
#   info button  : loot_items, loot_items_empty
#
# Actions: previous_page, next_page, sort_items, open_filter, sell_all,
# sell_and_exp, collect_exp, return_main, take_all, drop_page, none.

# Placeholders: {current_page}, {total_pages}, {entity}, {ᴇɴᴛɪᴛʏ}, {amount}
title: "&#545454{amount} {ᴇɴᴛɪᴛʏ} ꜱᴘᴀᴡɴᴇʀꜱ"
title_single: "&#545454{amount} {ᴇɴᴛɪᴛʏ} ꜱᴘᴀᴡɴᴇʀ"


# 1 ── Return to main menu ─────────────────────────────────────
slot_1:
  material: BARRIER
  name: "&#FC0000ʀᴇᴛᴜʀɴ"
  lore:
    - "&fClick to return to the main menu"
  enabled: true
  click:
    action: "return_main"
    sound: ui.button.click


# 2 ── Sort items ──────────────────────────────────────────────
slot_2:
  material: CAULDRON
  name: "&fꜱᴏʀᴛ &#5DB5F1ɪᴛᴇᴍꜱ"
  lore:
    - ""
    - "{available_items}"
    - ""
    - "&#5DB5F1 ▸ Click to sort!"
  sort_selected: " &#5DB5F1• {item_name}"
  sort_unselected: " &f• {item_name}"
  sort_empty: " &7• None"
  enabled: true
  click:
    action: "sort_items"
    sound_success:
      name: ui.button.click
      pitch: 1.2
    sound_fail: block.note_block.pling


# 3 ── Filter drops ────────────────────────────────────────────
slot_3:
  material: HOPPER
  name: "&fꜰɪʟᴛᴇʀ &#5DB5F1ᴅʀᴏᴘꜱ"
  lore:
    - ""
    - " &#5DB5F1ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:"
    - "  &8• &fConfigure allowed and"
    - "   &fblocked items for this spawner."
    - ""
    - "&#5DB5F1 ▸ Click to configure filters!"
  enabled: true
  click:
    action: "open_filter"
    sound: ui.button.click


# 4 ── Previous page ───────────────────────────────────────────
slot_4:
  material: ARROW
  name: "&#7AFC00ᴘʀᴇᴠɪᴏᴜꜱ"
  lore:
    - "&fClick to go back a page"
  enabled: true
  click:
    action: "previous_page"
    sound: ui.button.click


# 5 ── Sell / take all (depends on sell integration) ───────────
slot_5:
  material: GOLD_INGOT
  enabled: true
  if:
    sell_integration:
      name: "&#00F986ꜱᴇʟʟ ᴀʟʟ"
      lore:
        - "&fClick to sell all mob drops"
      click:
        action: "sell_all"
        sound: ui.button.click
        sound_success: block.note_block.bell
        sound_fail: block.note_block.pling
    no_sell_integration:
      material: SPECTRAL_ARROW
      name: "&#FCE300ᴛᴀᴋᴇ ᴀʟʟ"
      lore:
        - "&#FCE300● &fCollect loot from the storage"
      click:
        action: "take_all"
        sound_success: entity.item.pickup
        sound_fail: block.note_block.pling


# 6 ── Next page ───────────────────────────────────────────────
slot_6:
  material: ARROW
  name: "&#7AFC00ɴᴇxᴛ"
  lore:
    - "&fClick to go forward a page"
  enabled: true
  click:
    action: "next_page"
    sound: ui.button.click


# 8 ── Collect stored EXP ──────────────────────────────────────
slot_8:
  material: EXPERIENCE_BOTTLE
  name: "&fᴄᴏʟʟᴇᴄᴛ &#5DB5F1ᴇxᴘ"
  lore:
    - ""
    - " &#5DB5F1ℹ ɪɴꜰᴏʀᴍᴀᴛɪᴏɴ:"
    - "  &8• &fAvailable EXP: &a{current_exp}"
    - ""
    - "&#5DB5F1 ▸ Click to collect!"
  enabled: true
  click:
    action: "collect_exp"
    sound_success: entity.experience_orb.pickup
    sound_fail: block.note_block.pling


# 9 ── Drop current page ───────────────────────────────────────
slot_9:
  material: DROPPER
  name: "&#00F986ᴅʀᴏᴘ ʟᴏᴏᴛ"
  lore:
    - "&fClick to drop all the loot on the page"
  enabled: true
  click:
    action: "drop_page"
    sound_success:
      name: entity.item.pickup
      volume: 0.8
      pitch: 0.8
    sound_fail: block.note_block.pling
