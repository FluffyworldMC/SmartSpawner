# ──────────────────────────────────────────────────────────────
#  Main Spawner GUI – every icon, action and text in one file
# ──────────────────────────────────────────────────────────────
# Slot numbers are 1-27 (3 rows). Top-left is 1.
#
# A slot can use:
#   material / item / custom_texture   the icon
#   name / lore                        the text shown on the icon
#   item_model / custom_model_data     resource-pack components
#   amount / hide_tooltip              stack size and tooltip behaviour
#   enabled                            show or hide the button
#   info_button                        marks the spawner info head (timer target)
#   condition / if                     show a different look/action per server state
#                                      (sell_integration, no_sell_integration, is_owner)
#   click / left_click / right_click   action and sounds
#   cooldown                           per-player cooldown, e.g. "3s"
#
# Text placeholders: {entity}, {ᴇɴᴛɪᴛʏ}, {amount}, {stack_size}, {range},
# {delay}, {min_mobs}, {max_mobs}, {current_items}, {max_items},
# {percent_storage_rounded}, {percent_storage_decimal}, {current_exp},
# {max_exp}, {percent_exp_rounded}, {percent_exp_decimal}, {total_sell_price},
# {time}, {loot_items} and PlaceholderAPI %placeholders%.
#
# Extra keys understood by specific buttons:
#   storage button : loot_items, loot_items_empty
#   info button    : status_full, status_inactive, status_no_loot
#
# Actions: open_storage, sell_and_exp, collect_exp, manage_members, none.

title: "&8{entity} &7» &fSpawner"

# Open storage directly when a spawner is clicked.
skip_main_gui: false

# Sound played when this GUI opens. Use "none" to disable.
open_sound: "none"


# ── Members (owner only) ──────────────────────────────────────
slot_11:
  material: NAME_TAG
  name: "&e&lMEMBERS"
  lore:
    - "&8&m                              "
    - "&7Let other players open this spawner."
    - "&8&m                              "
    - "&eClick to manage members"
  condition: is_owner
  enabled: true
  click:
    action: "manage_members"
    sound: ui.button.click


# ── Storage ───────────────────────────────────────────────────
slot_12:
  material: CHEST
  name: "&a&lSTORAGE"
  lore:
    - "&8&m                              "
    - "&7Items: &f{current_items}&7/&f{max_slots}"
    - "&7Worth: &6${total_sell_price}"
    - "&8&m                              "
    - "&eClick to open"
  loot_items: "  &8• &f{item_name}&f: &e{amount}"
  loot_items_empty: "  &8• &fNo items stored"
  enabled: true
  click:
    action: "open_storage"
    sound: block.chest.open


# ── Spawner info / sell ───────────────────────────────────────
slot_14:
  material: PLAYER_HEAD
  name: "&6&l{entity} &7» &fSpawner"
  lore:
    - "&8&m                              "
    - "&7Stack: &f{stack_size}"
    - "&7Range: &f{range} &7blocks"
    - "&7Delay: &f{delay}s"
    - ""
    - "&6★ &7Next spawn: &f{time}"
    - "&7Storage: &f{percent_storage_rounded}% &8(&f{current_items}&7/&f{max_items}&8)"
    - "&7Experience: &f{percent_exp_rounded}%"
    - "&7Worth: &6${total_sell_price}"
    - "&8&m                              "
    - "&eLeft-click to sell & collect exp"
  status_full: "&cFull capacity"
  status_inactive: "&cInactive"
  status_no_loot: "&cNo loot configured"
  enabled: true
  info_button: true
  if:
    sell_integration:
      name: "&6&lSELL &7- &f{entity}"
      lore:
        - "&8&m                              "
        - "&6★ &7Next spawn: &f{time}"
        - "&7Items: &f{current_items}&7/&f{max_items}"
        - "&7Experience: &f{percent_exp_rounded}%"
        - "&7Worth: &6${total_sell_price}"
        - "&8&m                              "
        - "&eLeft-click to sell & collect exp"
      click:
        action: "sell_and_exp"
        sound: ui.button.click
        sound_success: block.note_block.bell
        sound_fail: block.note_block.pling
    no_sell_integration:
      name: "&6&l{entity} &7» &fSpawner"
      lore:
        - "&8&m                              "
        - "&7Stack: &f{stack_size}"
        - "&6★ &7Next spawn: &f{time}"
        - "&7Storage: &f{percent_storage_rounded}% &8(&f{current_items}&7/&f{max_items}&8)"
        - "&7Experience: &f{percent_exp_rounded}%"
        - "&8&m                              "
        - "&7Sell integration is not installed"
      click:
        action: "none"


# ── Experience ────────────────────────────────────────────────
slot_16:
  material: EXPERIENCE_BOTTLE
  name: "&b&lEXPERIENCE"
  lore:
    - "&8&m                              "
    - "&7Stored: &f{current_exp}&7/&f{max_exp}"
    - "&7Progress: &f{percent_exp_rounded}%"
    - "&8&m                              "
    - "&eClick to collect"
  enabled: true
  click:
    action: "collect_exp"
    sound_success: entity.experience_orb.pickup
    sound_fail: block.note_block.pling
