# Main GUI Layout Configuration
# Slot positions: 1-27 (3 rows of 9 slots each)
# Valid materials: https://jd.papermc.io/paper/1.21.8/org/bukkit/Material.html
#
# Optional title: supports & colours, {entity}, {ᴇɴᴛɪᴛʏ}, {amount} and %placeholderapi%.
# Buttons also accept item:, name:, lore:, item_model:, custom_model_data:, amount: and hide_tooltip:.
#
# Format:
#   slot_X:                    # X = slot number (1-27)
#     material: MATERIAL_NAME  # Material to display (use PLAYER_HEAD for spawner mob head)
#     item: 'MATERIAL[component=value]'
#                              # Optional full item instead of material (vanilla /give syntax or nbt:)
#     custom_texture: "..."    # Optional: Custom texture hash for PLAYER_HEAD (similar to spawner_mobs.yml)
#     name: "&aCustom name"    # Optional: overrides the language name ({placeholders} and %papi% work)
#     lore:                    # Optional: replaces the language lore
#       - "&7Line one"
#     item_model: mypack:icon  # Optional: item_model component
#     custom_model_data: 101   # Optional: custom_model_data component
#     amount: 1                # Optional: stack amount shown (1-99)
#     hide_tooltip: false      # Optional: hide the hover tooltip entirely
#     enabled: true/false      # Show/hide button
#     info_button: true/false  # Optional: Mark as spawner info button for timer updates
#     click:                   # Also supports left_click, right_click, and shift variants
#       action: "action"
#       sound: ui.button.click
#       sound_success: entity.experience_orb.pickup
#       sound_fail: block.note_block.pling
#     cooldown: "5s"           # Optional: Per-player cooldown; omitted by default
#
# Conditions:
#   sell_integration: Show only when sell/shop integration is enabled
#   no_sell_integration: Show only when sell/shop integration is disabled
#
# Actions:
#   open_storage: Open storage GUI
#   sell_and_exp: Sell all items and collect exp
#   collect_exp: Collect exp only
#   none: Display only, no action

# Title of the main menu.
title: "&8{entity} &7» &fSpawner"

# Skip main GUI and open storage directly when clicking spawner
# When enabled: Right-clicking a spawner opens the storage GUI directly
# When disabled: Right-clicking a spawner opens the main GUI first (default behavior)
skip_main_gui: false

# Sound played when opening the main GUI (volume and pitch default to 1.0)
# Set to "none" or leave empty to disable
open_sound: "none"


# Storage button
slot_12:
  material: CHEST
  name: "&a&lSTORAGE"
  lore:
    - "&8&m                              "
    - "&7Items: &f{current_items}&7/&f{max_slots}"
    - "&7Worth: &6${total_sell_price}"
    - "&8&m                              "
    - "&eClick to open"
  enabled: true
  click:
    action: "open_storage"
    sound: block.chest.open

# Spawner info button (conditional name, lore and actions)
slot_14:
  material: PLAYER_HEAD
  name: "&6&l{entity} &7» &fSpawner"
  lore:
    - "&8&m                              "
    - "&7Stack: &f{stack_size}"
    - "&7Range: &f{range} &7blocks"
    - "&7Delay: &f{delay}s"
    - ""
    - "&6★ &7Next spawn: &f{time}"
    - "&7Storage: &f{percent_storage_rounded}% &8(&f{current_items}&7/&f{max_items}&8)"
    - "&7Experience: &f{percent_exp_rounded}%"
    - "&7Worth: &6${total_sell_price}"
    - "&8&m                              "
    - "&eLeft-click to sell & collect exp"
  enabled: true
  info_button: true
  if:
    sell_integration:
      name: "&6&lSELL &7- &f{entity}"
      lore:
        - "&8&m                              "
        - "&6★ &7Next spawn: &f{time}"
        - "&7Items: &f{current_items}&7/&f{max_items}"
        - "&7Experience: &f{percent_exp_rounded}%"
        - "&7Worth: &6${total_sell_price}"
        - "&8&m                              "
        - "&eLeft-click to sell & collect exp"
      click:
        action: "sell_and_exp"
        sound: ui.button.click
        sound_success: block.note_block.bell
        sound_fail: block.note_block.pling
    no_sell_integration:
      name: "&6&l{entity} &7» &fSpawner"
      lore:
        - "&8&m                              "
        - "&7Stack: &f{stack_size}"
        - "&6★ &7Next spawn: &f{time}"
        - "&7Storage: &f{percent_storage_rounded}% &8(&f{current_items}&7/&f{max_items}&8)"
        - "&7Experience: &f{percent_exp_rounded}%"
        - "&8&m                              "
        - "&7Sell integration is not installed"
      click:
        action: "none"

# Experience bottle
slot_16:
  material: EXPERIENCE_BOTTLE
  name: "&b&lEXPERIENCE"
  lore:
    - "&8&m                              "
    - "&7Stored: &f{current_exp}&7/&f{max_exp}"
    - "&7Progress: &f{percent_exp_rounded}%"
    - "&8&m                              "
    - "&eClick to collect"
  enabled: true
  click:
    action: "collect_exp"
    sound_success: entity.experience_orb.pickup
    sound_fail: block.note_block.pling
